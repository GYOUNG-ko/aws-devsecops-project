name: PMS CI and ECR publish

on:
  pull_request:
    paths:
      - "app/**"
      - "backend/**"
      - "kubernetes/app/**"
      - ".github/workflows/pms-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "kubernetes/app/**"
      - ".github/workflows/pms-ci.yml"
  workflow_dispatch:

concurrency:
  group: pms-image-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: pms-backend

jobs:
  verify:
    name: Test, build, and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests and package
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          tags: pms-backend-ci:${{ github.sha }}

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pms-backend-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  publish:
    name: Publish immutable image and update GitOps digest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/github-actions-pms-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check whether this commit image already exists
        id: existing-image
        run: |
          set +e
          lookup="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="sha-${GITHUB_SHA}" \
            2>&1)"
          lookup_status=$?
          set -e
          if [ "${lookup_status}" -eq 0 ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif grep -q "ImageNotFoundException" <<< "${lookup}"; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          else
            echo "${lookup}" >&2
            exit "${lookup_status}"
          fi

      - name: Build immutable commit image
        id: image
        if: steps.existing-image.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image_tag="${ECR_REGISTRY}/${ECR_REPOSITORY}:sha-${GITHUB_SHA}"
          docker buildx build \
            --file backend/Dockerfile \
            --load \
            --tag "${image_tag}" \
            .
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Scan release image before push
        if: steps.existing-image.outputs.exists != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push image to ECR
        if: steps.existing-image.outputs.exists != 'true'
        run: docker push "${{ steps.image.outputs.tag }}"

      - name: Resolve pushed image digest
        id: digest
        run: |
          image_digest="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="sha-${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test -n "${image_digest}"
          test "${image_digest}" != "None"
          echo "value=${image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Update Kubernetes image to immutable digest
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          image_ref="${ECR_REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          sed -i -E "s#^([[:space:]]*)image: .*pms-backend.*#\1image: ${image_ref}#" kubernetes/app/deployment.yaml
          grep -F "image: ${image_ref}" kubernetes/app/deployment.yaml

      - name: Commit GitOps digest update
        run: |
          if git diff --quiet -- kubernetes/app/deployment.yaml; then
            echo "Deployment already uses this digest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/app/deployment.yaml
          git commit -m "chore(deploy): pin PMS image ${GITHUB_SHA::12} [skip ci]"
          git push
