apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: web-app-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/GYOUNG-ko/aws-devsecops-project
    targetRevision: main

    # 실제 GitHub 저장소 내부의 앱 manifest 경로
    path: kubernetes/app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true