# Do not add this example to kustomization.yaml or commit real credentials.
# Create `pms-auth` through the deployment secret-management process before Argo CD sync.
apiVersion: v1
kind: Secret
metadata:
  name: pms-auth
  namespace: default
type: Opaque
stringData:
  user-name: replace-me
  user-password: replace-me
  admin-name: replace-me
  admin-password: replace-me
